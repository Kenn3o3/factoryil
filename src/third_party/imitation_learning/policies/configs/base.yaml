  train_episodes: null
  test_episodes: null
  dataset_class: base_dataset
  dataset:
    num_training_steps: ???
    path: null
    num_points: 1024
    num_demos: null
    num_augment: 0
    same_aug_per_sample: true
    aug_keep_original: true
    aug_scale_low: 0.5
    aug_scale_high: 1.5
    aug_scale_aspect_limit: 1.0
    aug_scale_rot: -1
    aug_scale_pos: 0.1
    aug_zero_z_offset: false
    aug_center: [0., 0., 0.]
    shuffle_pc: true
    num_workers: 12
    dof: ${env.dof}
    num_eef: ${env.num_eef}
    eef_dim: ${env.eef_dim}
    obs_horizon: ${model.obs_horizon}
    pred_horizon: ${model.pred_horizon}
    reduce_horizon_dim: false
    min_demo_length: 15
    cache_rgb: true # true
    precache: true            # disable full-dataset cache build; use lazy loading

model:
  hidden_dim: 32
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    prediction_type: epsilon
  obs_horizon: 2
  ac_horizon: 8
  pred_horizon: 16
  encoder:
    c_dim: ${model.hidden_dim}
    backbone_type: vn_pointnet
    backbone_args:
      h_dim: ${model.hidden_dim}
      c_dim: ${model.encoder.c_dim}
      num_layers: 4
      knn: 8
  obs_mode: ${env.args.obs_mode}
  ac_mode: ${env.args.ac_mode}
  use_torch_compile: false

training:  
  train_test_split: 0.8
  batch_size: 32
  num_epochs: 1
  lr: 3e-5
  weight_decay: 1e-6
  save_interval: 50
  check_topk_every: 10
  ckpt: null

hydra:
  run:
    dir: ${log_dir}/${now:%Y%m%d_%H%M}_${prefix}

wandb:
  entity: roccendalanda-cuhk
  project: DRIFT-DP