prefix: default
device: cuda
mode: train
log_dir: exp_data/models
eval_data_path: null
use_wandb: true
seed: 0

agent:
  agent_name: dp

env:
  env_class: ???
  num_eef: 2
  dof: 7
  eef_dim: 13
  vectorize: false
  args:
    num_eef: ${env.num_eef}
    dof: ${env.dof}
    seed: ${seed}
    obs_mode: "pc"
    ac_mode: "rel"
    max_episode_length: ???
    num_points: ${data.dataset.num_points}
    randomize_rotation: false
    randomize_scale: false
    scale_low: 1.0
    scale_high: 1.0
    scale_aspect_limit: 100.0
    uniform_scaling: false

